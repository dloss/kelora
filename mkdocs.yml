site_name: Kelora
site_description: Scriptable log processor with embedded Rhai scripting
site_url: https://dloss.github.io/kelora/
repo_url: https://github.com/dloss/kelora
repo_name: dloss/kelora

theme:
  name: material
  logo: kelora-logo.svg
  favicon: kelora-logo.svg
  palette:
    # Light/dark mode toggle
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant # Fast page loads
    - navigation.tracking # Update URL with scroll
    - navigation.tabs # Top-level tabs
    - navigation.sections # Expand sections
    - navigation.footer # Previous/next links
    - search.suggest # Search suggestions
    - search.highlight # Highlight search terms
    - content.code.copy # Copy code blocks
    - content.code.annotate # Annotate code with numbers

hooks:
  - dev/docs_tty_hook.py

plugins:
  - search:
      lang: en
  - mike:
      version_selector: true
      alias_type: symlink
  - markdown-exec:
      ansi: required
  - redirects:
      redirect_maps:
        quickstart.md: guide/explore.md
        tutorials/index.md: guide/explore.md
        tutorials/basics.md: guide/explore.md
        tutorials/intro-to-rhai.md: guide/scripting.md
        tutorials/working-with-time.md: guide/time.md
        tutorials/metrics-and-tracking.md: guide/summarize.md
        tutorials/begin-end-stages.md: guide/state.md
        tutorials/advanced-scripting.md: guide/scripting.md
        tutorials/parsing-custom-formats.md: guide/parse.md
        tutorials/span-aggregation.md: guide/spans.md
        tutorials/configuration-and-reusability.md: guide/config.md
        tutorials/composed-pipelines.md: cookbook.md
        how-to/index.md: cookbook.md
        how-to/incident-response-playbooks.md: cookbook.md
        how-to/debug-issues.md: reference/troubleshooting.md
        how-to/find-errors-in-logs.md: cookbook.md
        how-to/analyze-web-traffic.md: cookbook.md
        how-to/monitor-application-health.md: cookbook.md
        how-to/parse-syslog-files.md: cookbook.md
        how-to/handle-multiline-stacktraces.md: reference/multiline.md
        how-to/extract-and-mask-sensitive-data.md: cookbook.md
        how-to/pseudonymize-identifiers-for-analytics.md: cookbook.md
        how-to/process-csv-data.md: cookbook.md
        how-to/fan-out-nested-structures.md: guide/scripting.md
        how-to/build-streaming-alerts.md: cookbook.md
        how-to/batch-process-archives.md: guide/files.md
        how-to/merge-timestamp-sorted-files.md: guide/files.md
        how-to/span-aggregation-cookbook.md: guide/spans.md
        how-to/integrate-external-tools.md: guide/output.md
        how-to/power-user-techniques.md: cookbook.md
        how-to/stateful-processing.md: guide/state.md
        concepts/index.md: how-it-works.md
        concepts/pipeline-model.md: how-it-works.md
        concepts/events-and-fields.md: guide/scripting.md
        concepts/scripting-stages.md: how-it-works.md
        concepts/error-handling.md: how-it-works.md
        concepts/multiline-strategies.md: reference/multiline.md
        concepts/performance-model.md: guide/files.md
        concepts/performance-comparisons.md: reference/benchmarks.md
        concepts/benchmark-results.md: reference/benchmarks.md
        concepts/configuration-system.md: guide/config.md
        reference/index.md: index.md
        reference/common-errors.md: reference/troubleshooting.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [examples]
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  links:
    anchors: warn

extra_css:
  - stylesheets/ansi-colors.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dloss/kelora

nav:
  - Home: index.md
  - Install: installation.md
  - Guide:
      - Explore a Log File: guide/explore.md
      - Get Logs into Shape: guide/parse.md
      - Filter: guide/filter.md
      - Transform with Scripts: guide/scripting.md
      - Summarize: guide/summarize.md
      - Work with Time: guide/time.md
      - Group into Spans: guide/spans.md
      - Cross-Event Logic: guide/state.md
      - Output and Integration: guide/output.md
      - Big Files, Many Files: guide/files.md
      - Configuration and Aliases: guide/config.md
  - Cookbook: cookbook.md
  - How It Works: how-it-works.md
  - Reference:
      - CLI Options: reference/cli-reference.md
      - Functions: reference/functions.md
      - Formats: reference/formats.md
      - Multiline: reference/multiline.md
      - Time Formats: reference/time-reference.md
      - Rhai Cheatsheet: reference/rhai-cheatsheet.md
      - Script Variables: reference/script-variables.md
      - Exit Codes: reference/exit-codes.md
      - Troubleshooting: reference/troubleshooting.md
      - FAQ: faq.md
      - Glossary: glossary.md
      - Benchmarks: reference/benchmarks.md
      - What's New in 2.0: whats-new-2.0.md
